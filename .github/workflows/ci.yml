name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    strategy:
      matrix:
        node: ['22.13.0', '23.4.0', '24.x']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm --prefix web ci
      - run: npm run build:all
      - run: npm test
      - run: node dist/cli.js stats --json
        env:
          SKILLHUB_DATA_DIR: ${{ runner.temp }}/skillhub
